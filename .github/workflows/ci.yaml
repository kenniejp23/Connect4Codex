name: c4a0 CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install tools with mise
        uses: jdx/mise-action@v3
        with:
          version: 2026.1.6
          install: true
          cache: true

      - name: Install desktop runtime libraries
        run: |
          sudo apt-get update
          xargs -r -a scripts/linux-runtime-packages.txt sudo apt-get install -y
          sudo apt-get install -y xvfb xauth

      - name: X11 desktop interaction
        run: |
          mise run install
          mise exec -- uv run python -c 'import ctypes; from pathlib import Path; from PySide6.QtCore import QLibraryInfo; ctypes.CDLL(str(Path(QLibraryInfo.path(QLibraryInfo.LibraryPath.PluginsPath)) / "platforms/libqxcb.so"))'
          xvfb-run -a env QT_QPA_PLATFORM=xcb mise exec -- uv run pytest -q -s tests/c4a0_tests/gui_test.py

      - name: Run CI tasks
        run: mise run ci
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Installed wheel with locked dependencies
        run: mise exec -- bash scripts/check-wheel.sh locked

      - name: Audit locked runtime dependencies
        run: mise exec -- uvx pip-audit==2.10.1 --disable-pip --no-deps -r constraints/linux-py311.txt

  native-sanitizers:
    strategy:
      fail-fast: false
      matrix:
        task: ["test:sanitize", "test:thread"]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install tools with mise
        uses: jdx/mise-action@v3
        with:
          version: 2026.1.6
          install: true
          cache: true

      - name: Run native sanitizer suite
        run: mise run ${{ matrix.task }}
