[project]
name = "c4a0"
version = "0.1.0"
description = "AlphaZero-style Connect Four training and play with a C++20 engine"
authors = [{ name = "Advait Shinde", email = "advait.shinde@gmail.com" }]
dependencies = [
  "pytorch-lightning>=2.6.5",
  "numpy>=2.4.6",
  "einops>=0.8.2",
  "torchmetrics>=1.9.0",
  "tensorboardx>=2.6.5",
  "tensorboard>=2.21.0",
  "tqdm>=4.68.3",
  "jupyterlab>=4.6.1",
  "pydantic>=2.13.4",
  "tabulate>=0.10.0",
  "matplotlib>=3.11.0",
  "loguru>=0.7.3",
  "typer>=0.26.8",
  "optuna>=4.9.0",
  "optuna-dashboard>=0.20.0",
  "torch>=2.12.1",
]
readme = "README.md"
requires-python = ">= 3.11"

[build-system]
requires = [
  "scikit-build-core==1.0.3",
  "nanobind==2.15.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.28"
ninja.version = ">=1.13"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/c4a0", "src/c4a0_cpp"]
sdist.include = [
  "CMakeLists.txt",
  "CMakePresets.json",
  "benchmarks/**",
  "cpp/include/**",
  "cpp/src/**",
  "cpp/tests/**",
  "scripts/check-wheel.sh",
  "tests/fixtures/**",
]
sdist.exclude = [
  "UPGRADE_LOG.md",
  "claude-upgrade-progress.json",
]

[tool.scikit-build.cmake.define]
C4A0_BUILD_PYTHON = "ON"
C4A0_BUILD_TESTS = "OFF"
C4A0_BUILD_BENCHMARKS = "OFF"

[tool.uv]
managed = true

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pyright>=1.1.411",
  "jupyterlab>=4.6.1",
  "pandas>=3.0.3",
  "rankit>=0.3.3",
  "ruff>=0.15.20",
  "ninja==1.13.0",
  "clang-format==22.1.8",
]

[tool.pyright]
typeCheckingMode = "basic"
include = ["src", "tests"]
exclude = ["build", "work"]
extraPaths = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  # Disable warnings we get form pytorch lightning that clutter pytest output
  "ignore:pkg_resources is deprecated.*:DeprecationWarning",
  "ignore:Deprecated call to `pkg_resources.declare_namespace`.*:DeprecationWarning",
  "ignore:Deprecated call to `pkg_resources.declare_namespace.*:DeprecationWarning",
  "ignore:You are trying to `self.log()` but the `self.trainer` reference is not registered on the model yet.*",
]
