min_version = "2026.1.6"

[task_config]
dir = "{{config_root}}"

[tools]
python = "3.11.13"
uv = "0.11.25"
cmake = "3.28.3"
ninja = "1.13.0"

[env]
UV_LINK_MODE = "copy"

# Bootstrap

[tasks.install]
description = "Install Python dependencies and build the editable package with uv"
run = "uv sync --frozen"
sources = [
  "pyproject.toml",
  "uv.lock",
  "CMakeLists.txt",
  "cpp/include/**/*",
  "cpp/src/**/*",
  "src/**/*",
]
outputs = [".venv/pyvenv.cfg", ".venv/lib/python3.11/site-packages/c4a0_cpp/_native*.so"]

[tasks."install:update"]
description = "Install dependencies and allow uv.lock updates"
run = "uv sync"
sources = ["pyproject.toml", "uv.lock"]
outputs = [".venv/pyvenv.cfg"]

# Build

[tasks.build]
description = "Rebuild/install the optimized C++ extension into the uv environment"
run = "uv sync --frozen --reinstall-package c4a0"

# Validation

[tasks.check]
description = "Run lint, typecheck, C++ tests, and Python tests"
run = [
  { task = "lint" },
  { task = "typecheck" },
  { task = "test:cpp" },
  { task = "test:python" },
]

[tasks.lint]
description = "Run Ruff and C++ formatting checks"
depends = ["install"]
run = [
  "uv run ruff check",
  "find cpp -type f \\( -name '*.cpp' -o -name '*.hpp' \\) -print0 | xargs -0 uv run clang-format --dry-run --Werror",
]

[tasks.typecheck]
description = "Run Pyright type checks"
depends = ["install"]
run = "uv run pyright"

[tasks.test]
description = "Run all C++ and Python tests"
depends = ["test:cpp", "test:python"]

[tasks."test:cpp"]
description = "Configure, build, and run C++ unit/property tests"
run = [
  "cmake --preset dev",
  "cmake --build --preset dev",
  "ctest --preset dev",
]

[tasks."test:sanitize"]
description = "Run C++ tests with AddressSanitizer and UndefinedBehaviorSanitizer"
run = [
  "cmake --preset asan-ubsan",
  "cmake --build --preset asan-ubsan",
  "ctest --preset asan-ubsan",
]

[tasks."test:thread"]
description = "Run C++ core concurrency tests with ThreadSanitizer"
run = [
  "cmake --preset tsan",
  "cmake --build --preset tsan",
  "ctest --preset tsan",
]

[tasks."test:python"]
description = "Run Python tests"
depends = ["build"]
run = "uv run pytest -q"

[tasks."test:wheel"]
description = "Build a wheel and verify clean-environment imports"
run = "scripts/check-wheel.sh"

[tasks.ci]
description = "Run the full CI validation suite"
run = [
  { task = "lint" },
  { task = "typecheck" },
  { task = "test:cpp" },
  { task = "test:python" },
  { task = "test:wheel" },
  { task = "train:smoke" },
]

# Training / app lifecycle

[tasks."train:smoke"]
description = "Run a bounded asynchronous CPU V2 training smoke job"
depends = ["build"]
run = "uv run pytest -q tests/c4a0_tests/training_v2_test.py::test_async_worker_completes_after_one_candidate_decision"

[tasks."benchmark:training"]
description = "Run the fixed-workload V2 end-to-end training benchmark"
depends = ["build"]
run = "uv run c4a0 benchmark-training benchmark-results/v2.json --workflow v2"

[tasks.gui]
description = "Launch the native PySide6 desktop application"
depends = ["build"]
run = "uv run c4a0 gui"
